<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>酷狗歌曲热度</title>
  <link rel="stylesheet" href="/scripts/common.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    .err { display: none; }
  </style>
</head>
<body>
  <div class="page">
    <div class="header-card">
      <h1 class="title" id="song-title">酷狗歌曲热度</h1>
      <p class="subtitle" id="song-subtitle">加载中...</p>
      <div class="header-actions">
        <div class="nav-links">
          <a href="/">首页</a>
          <a href="/changereport">变化报告</a>
          <a href="/new-song">新歌</a>
          <a href="https://activity.kugou.com/chart/v-6540f41e/index.html?mixsongid={{ mixsongid }}" target="_blank">酷狗原页</a>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
      </div>
    </div>

    <div id="loading" class="loading">正在获取热度数据...</div>
    <div id="error-msg" class="err"></div>

    <div id="content" style="display:none;">
      <div class="block">
        <h3>酷狗指数</h3>
        <div class="metrics-grid" id="metrics-grid"></div>
      </div>

      <div class="block" id="record-block" style="display:none;">
        <h3>上榜记录</h3>
        <ul class="record-list" id="record-list"></ul>
      </div>

      <div class="block" id="chart-block" style="display:none;">
        <h3 id="chart-title">指数趋势</h3>
        <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;" id="chart-range-btns">
          <button type="button" class="range-btn active" data-key="chart" data-label="近 7 天">近 7 天</button>
          <button type="button" class="range-btn" data-key="chart_30d" data-label="近 30 天">近 30 天</button>
          <button type="button" class="range-btn" data-key="chart_183d" data-label="近半年">近半年</button>
        </div>
        <div class="chart-wrap">
          <canvas id="heat-chart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() { var s = localStorage.getItem("qqmc_theme"); if (s) document.body.setAttribute("data-theme", s); })();
    function toggleTheme() { var t = document.body.getAttribute("data-theme") === "light" ? "dark" : "light"; document.body.setAttribute("data-theme", t); localStorage.setItem("qqmc_theme", t); }

    var mixsongid = "{{ mixsongid }}";
    if (!mixsongid) {
      document.getElementById("loading").style.display = "none";
      document.getElementById("error-msg").style.display = "block";
      document.getElementById("error-msg").textContent = "缺少 mixsongid 参数";
    } else {
      fetch("/api/song-heat-kugou?mixsongid=" + encodeURIComponent(mixsongid) + "&_=" + Date.now())
        .then(function(r) { return r.json(); })
        .then(function(data) {
          document.getElementById("loading").style.display = "none";
          if (!data.ok) {
            document.getElementById("error-msg").style.display = "block";
            document.getElementById("error-msg").textContent = data.error || "获取失败";
            return;
          }
          renderData(data);
        })
        .catch(function(e) {
          document.getElementById("loading").style.display = "none";
          document.getElementById("error-msg").style.display = "block";
          document.getElementById("error-msg").textContent = "请求失败: " + e.message;
        });
    }

    var heatChartInstance = null;
    var cachedData = null;

    function renderData(d) {
      cachedData = d;
      document.getElementById("song-title").textContent = d.song_name || mixsongid;
      var authors = (d.author_names || []).join(", ");
      var subtitle = authors || "";
      if (d.album_name) subtitle += (subtitle ? " · " : "") + d.album_name;
      document.getElementById("song-subtitle").textContent = subtitle;
      document.title = (d.song_name || "酷狗歌曲") + " - 热度";

      var metrics = [];
      if (d.exponent != null) metrics.push({label: "酷狗指数", value: Math.round(d.exponent).toLocaleString()});
      if (d.exponent_diff != null) {
        var diff = parseFloat(d.exponent_diff);
        var diffStr = (diff > 0 ? "+" : "") + Math.round(diff).toLocaleString();
        var diffColor = diff > 0 ? "#63d9aa" : diff < 0 ? "#ffa2b1" : "var(--muted)";
        metrics.push({label: "指数变化", value: diffStr, color: diffColor});
      }
      if (d.rank != null) metrics.push({label: "排名", value: "#" + d.rank.toLocaleString()});
      if (d.rank_diff != null) {
        var rd = parseInt(d.rank_diff);
        var rdStr = rd < 0 ? "↑" + Math.abs(rd) : rd > 0 ? "↓" + rd : "-";
        var rdColor = rd < 0 ? "#63d9aa" : rd > 0 ? "#ffa2b1" : "var(--muted)";
        metrics.push({label: "排名变化", value: rdStr, color: rdColor});
      }
      if (d.collect_count != null) metrics.push({label: "收藏量", value: Number(d.collect_count).toLocaleString()});
      if (d.listener_num != null) metrics.push({label: "收听人数", value: Number(d.listener_num).toLocaleString()});
      if (d.listener_num_incr != null) metrics.push({label: "今日收听增量", value: "+" + Number(d.listener_num_incr).toLocaleString()});

      var grid = document.getElementById("metrics-grid");
      grid.innerHTML = metrics.map(function(m) {
        var style = m.color ? ' style="color:' + m.color + '"' : '';
        return '<div class="metric-item"><div class="metric-value"' + style + '>' + m.value + '</div><div class="metric-label">' + m.label + '</div></div>';
      }).join("");

      // 上榜记录
      var ranks = d.rank_list || [];
      if (ranks.length > 0) {
        document.getElementById("record-block").style.display = "block";
        var list = document.getElementById("record-list");
        list.innerHTML = ranks.map(function(r) {
          var el = document.createElement("div"); el.textContent = r.title;
          return '<li>' + el.innerHTML + '<span class="record-date">' + (r.date || '') + '</span></li>';
        }).join("");
      }

      // 图表 — 选择最优数据源并显示
      var chartKey = d.chart ? "chart" : d.chart_30d ? "chart_30d" : d.chart_183d ? "chart_183d" : "";
      if (chartKey) {
        document.getElementById("chart-block").style.display = "block";
        switchChart(chartKey);
      }

      document.getElementById("content").style.display = "block";
    }

    function switchChart(key) {
      if (!cachedData) return;
      var chart = cachedData[key];
      if (!chart || !chart.date_list || !chart.score_list) return;
      // 更新按钮状态和标题
      var btns = document.querySelectorAll("#chart-range-btns .range-btn");
      var label = "";
      btns.forEach(function(b) {
        if (b.getAttribute("data-key") === key) {
          b.classList.add("active");
          label = b.getAttribute("data-label");
          // 灰掉无数据的按钮
        } else {
          b.classList.remove("active");
        }
        var bk = b.getAttribute("data-key");
        var hasData = cachedData[bk] && cachedData[bk].date_list && cachedData[bk].date_list.length > 0;
        b.disabled = !hasData;
        b.style.opacity = hasData ? "1" : "0.4";
      });
      document.getElementById("chart-title").textContent = (label || "指数") + "趋势";
      renderChart(chart.date_list, chart.score_list);
    }

    function renderChart(dates, scores) {
      var labels = dates.map(function(ts) {
        var d = new Date(ts * 1000);
        return (d.getMonth()+1) + "/" + d.getDate();
      });
      var isDark = document.body.getAttribute("data-theme") !== "light";
      var ctx = document.getElementById("heat-chart").getContext("2d");
      if (heatChartInstance) { heatChartInstance.destroy(); heatChartInstance = null; }
      heatChartInstance = new Chart(ctx, {
        type: "line",
        data: {
          labels: labels,
          datasets: [{
            label: "酷狗指数",
            data: scores,
            borderColor: isDark ? "#4297c9" : "#0ea5e9",
            backgroundColor: isDark ? "rgba(66,151,201,0.1)" : "rgba(14,165,233,0.1)",
            borderWidth: 2, pointRadius: 2, fill: true, tension: 0.3
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: "index", intersect: false },
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: function(item) { return "指数: " + Math.round(item.raw).toLocaleString(); } } } },
          scales: {
            x: { ticks: { color: isDark ? "#93a4ba" : "#65708a", font: { size: 11 } }, grid: { color: "var(--chart-grid)" } },
            y: { ticks: { color: isDark ? "#93a4ba" : "#65708a", font: { size: 11 } }, grid: { color: isDark ? "rgba(154,172,191,0.15)" : "rgba(148,163,184,0.2)" } }
          }
        }
      });
    }

    // 时间范围切换
    document.getElementById("chart-range-btns").addEventListener("click", function(e) {
      var btn = e.target.closest(".range-btn");
      if (!btn || btn.classList.contains("active") || btn.disabled) return;
      switchChart(btn.getAttribute("data-key"));
    });
  </script>
</body>
</html>
