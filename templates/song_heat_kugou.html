<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>酷狗歌曲热度</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f141d; --card: #171f2b; --border: #2a3547; --text: #d7e1f0;
      --muted: #93a4ba; --primary: #5f8fd6; --error-bg: #341c22; --error-text: #ffa2b1;
      --card-soft: #121a26; --shadow-soft: 0 10px 24px rgba(6, 10, 20, 0.32);
      --chart-grid: rgba(154, 172, 191, 0.2);
    }
    body[data-theme="light"] {
      --bg: #f4f7ff; --card: #ffffff; --border: #e3e8f5; --text: #1f2a44;
      --muted: #65708a; --primary: #3b82f6; --error-bg: #fef2f2; --error-text: #b91c1c;
      --card-soft: #fbfdff; --shadow-soft: 0 8px 24px rgba(30, 70, 140, 0.08);
      --chart-grid: rgba(148, 163, 184, 0.28);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--text); line-height: 1.55;
      background: linear-gradient(0deg, rgba(15,22,34,0.70), rgba(15,22,34,0.70)), url("/scripts/2.jpg") center/cover no-repeat fixed;
    }
    body[data-theme="light"] {
      background: linear-gradient(0deg, rgba(244,248,255,0.70), rgba(244,248,255,0.70)), url("/scripts/2.jpg") center/cover no-repeat fixed;
    }
    .page { width: 100%; max-width: 1200px; margin: 0 auto; padding: 14px 18px 24px; }
    .header-card {
      position: relative; overflow: hidden;
      background: linear-gradient(135deg, #1e2a3b 0%, #162132 100%);
      border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px;
      box-shadow: var(--shadow-soft); margin-bottom: 12px;
    }
    .header-card::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(150,182,230,0.18) 0%, rgba(11,20,34,0.04) 100%); pointer-events: none; }
    .header-card > * { position: relative; z-index: 2; }
    body[data-theme="light"] .header-card { background: linear-gradient(135deg, #fff 0%, #f7faff 100%); }
    .title { margin: 0 0 4px; font-size: 24px; font-weight: 700; }
    .subtitle { color: var(--muted); font-size: 14px; margin: 0; }
    .header-actions { margin-top: 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .nav-links a { color: var(--primary); text-decoration: none; margin-right: 14px; }
    .nav-links a:hover { text-decoration: underline; }
    button.theme-toggle { min-height: 30px; padding: 5px 12px; border-radius: 999px; font-size: 12px; border: 1px solid var(--border); background: #1f2c3f; color: #d7e4fa; cursor: pointer; }
    body[data-theme="light"] button.theme-toggle { background: #fff; color: #334155; }
    .block { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px 12px; margin-top: 12px; box-shadow: var(--shadow-soft); }
    .block h3 { margin: 0 0 10px; font-size: 17px; font-weight: 650; }
    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .metric-item { background: var(--card-soft); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; text-align: center; }
    .metric-value { font-size: 22px; font-weight: 700; color: var(--primary); margin-bottom: 2px; }
    .metric-label { font-size: 12px; color: var(--muted); }
    .record-list { list-style: none; padding: 0; margin: 0; }
    .record-list li { padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 14px; }
    .record-list li:last-child { border-bottom: none; }
    .record-date { color: var(--muted); font-size: 12px; margin-left: 8px; }
    .chart-wrap { width: 100%; height: 260px; padding: 16px; background: var(--card-soft); border-radius: 12px; border: 1px solid var(--border); box-shadow: var(--shadow-soft); margin-top: 10px; }
    .loading { text-align: center; color: var(--muted); padding: 20px; }
    .err { color: var(--error-text); background: var(--error-bg); padding: 8px 12px; border-radius: 8px; margin-top: 8px; display: none; }
    @media (max-width: 600px) { .metrics-grid { grid-template-columns: repeat(2, 1fr); } .chart-wrap { height: 200px; } }
  </style>
</head>
<body>
  <div class="page">
    <div class="header-card">
      <h1 class="title" id="song-title">酷狗歌曲热度</h1>
      <p class="subtitle" id="song-subtitle">加载中...</p>
      <div class="header-actions">
        <div class="nav-links">
          <a href="/">← 首页</a>
          <a href="https://activity.kugou.com/chart/v-6540f41e/index.html?mixsongid={{ mixsongid }}" target="_blank">酷狗原页</a>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">切换主题</button>
      </div>
    </div>

    <div id="loading" class="loading">正在获取热度数据...</div>
    <div id="error-msg" class="err"></div>

    <div id="content" style="display:none;">
      <div class="block">
        <h3>酷狗指数</h3>
        <div class="metrics-grid" id="metrics-grid"></div>
      </div>

      <div class="block" id="record-block" style="display:none;">
        <h3>上榜记录</h3>
        <ul class="record-list" id="record-list"></ul>
      </div>

      <div class="block" id="chart-block" style="display:none;">
        <h3>近 7 天指数趋势</h3>
        <div class="chart-wrap">
          <canvas id="heat-chart"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() { var s = localStorage.getItem("qqmc_theme"); if (s) document.body.setAttribute("data-theme", s); })();
    function toggleTheme() { var t = document.body.getAttribute("data-theme") === "light" ? "dark" : "light"; document.body.setAttribute("data-theme", t); localStorage.setItem("qqmc_theme", t); }

    var mixsongid = "{{ mixsongid }}";
    if (!mixsongid) {
      document.getElementById("loading").style.display = "none";
      document.getElementById("error-msg").style.display = "block";
      document.getElementById("error-msg").textContent = "缺少 mixsongid 参数";
    } else {
      fetch("/api/song-heat-kugou?mixsongid=" + encodeURIComponent(mixsongid) + "&_=" + Date.now())
        .then(function(r) { return r.json(); })
        .then(function(data) {
          document.getElementById("loading").style.display = "none";
          if (!data.ok) {
            document.getElementById("error-msg").style.display = "block";
            document.getElementById("error-msg").textContent = data.error || "获取失败";
            return;
          }
          renderData(data);
        })
        .catch(function(e) {
          document.getElementById("loading").style.display = "none";
          document.getElementById("error-msg").style.display = "block";
          document.getElementById("error-msg").textContent = "请求失败: " + e.message;
        });
    }

    function renderData(d) {
      document.getElementById("song-title").textContent = d.song_name || mixsongid;
      document.getElementById("song-subtitle").textContent = d.album_name || "";
      document.title = (d.song_name || "酷狗歌曲") + " - 热度";

      var metrics = [];
      if (d.exponent != null) metrics.push({label: "酷狗指数", value: Math.round(d.exponent).toLocaleString()});
      if (d.exponent_diff != null) {
        var diff = parseFloat(d.exponent_diff);
        var diffStr = (diff > 0 ? "+" : "") + Math.round(diff).toLocaleString();
        var diffColor = diff > 0 ? "#63d9aa" : diff < 0 ? "#ffa2b1" : "var(--muted)";
        metrics.push({label: "指数变化", value: diffStr, color: diffColor});
      }
      if (d.rank != null) metrics.push({label: "排名", value: "#" + d.rank.toLocaleString()});
      if (d.rank_diff != null) {
        var rd = parseInt(d.rank_diff);
        var rdStr = rd < 0 ? "↑" + Math.abs(rd) : rd > 0 ? "↓" + rd : "-";
        var rdColor = rd < 0 ? "#63d9aa" : rd > 0 ? "#ffa2b1" : "var(--muted)";
        metrics.push({label: "排名变化", value: rdStr, color: rdColor});
      }
      if (d.collect_count != null) metrics.push({label: "收藏量", value: Number(d.collect_count).toLocaleString()});
      if (d.listener_num != null) metrics.push({label: "收听人数", value: Number(d.listener_num).toLocaleString()});
      if (d.listener_num_incr != null) metrics.push({label: "今日收听增量", value: "+" + Number(d.listener_num_incr).toLocaleString()});

      var grid = document.getElementById("metrics-grid");
      grid.innerHTML = metrics.map(function(m) {
        var style = m.color ? ' style="color:' + m.color + '"' : '';
        return '<div class="metric-item"><div class="metric-value"' + style + '>' + m.value + '</div><div class="metric-label">' + m.label + '</div></div>';
      }).join("");

      // 上榜记录
      var ranks = d.rank_list || [];
      if (ranks.length > 0) {
        document.getElementById("record-block").style.display = "block";
        var list = document.getElementById("record-list");
        list.innerHTML = ranks.map(function(r) {
          var el = document.createElement("div"); el.textContent = r.title;
          return '<li>' + el.innerHTML + '<span class="record-date">' + (r.date || '') + '</span></li>';
        }).join("");
      }

      // 图表
      var chart = d.chart || d.chart_30d;
      if (chart && chart.date_list && chart.score_list) {
        document.getElementById("chart-block").style.display = "block";
        renderChart(chart.date_list, chart.score_list);
      }

      document.getElementById("content").style.display = "block";
    }

    function renderChart(dates, scores) {
      var labels = dates.map(function(ts) {
        var d = new Date(ts * 1000);
        return (d.getMonth()+1) + "/" + d.getDate();
      });
      var isDark = document.body.getAttribute("data-theme") !== "light";
      var ctx = document.getElementById("heat-chart").getContext("2d");
      new Chart(ctx, {
        type: "line",
        data: {
          labels: labels,
          datasets: [{
            label: "酷狗指数",
            data: scores,
            borderColor: isDark ? "#4297c9" : "#0ea5e9",
            backgroundColor: isDark ? "rgba(66,151,201,0.1)" : "rgba(14,165,233,0.1)",
            borderWidth: 2, pointRadius: 2, fill: true, tension: 0.3
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: "index", intersect: false },
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: function(item) { return "指数: " + Math.round(item.raw).toLocaleString(); } } } },
          scales: {
            x: { ticks: { color: isDark ? "#93a4ba" : "#65708a", font: { size: 11 } }, grid: { color: "var(--chart-grid)" } },
            y: { ticks: { color: isDark ? "#93a4ba" : "#65708a", font: { size: 11 } }, grid: { color: isDark ? "rgba(154,172,191,0.15)" : "rgba(148,163,184,0.2)" } }
          }
        }
      });
    }
  </script>
</body>
</html>
